[workspace]
members = [".", "crates/graphene-ide-core"]
exclude = ["ide/src-tauri"]

[package]
name = "graphene"
version = "0.2.0"
edition = "2021"
description = "Graphene (.grph): a deterministic dataflow language checked before it runs"
license = "MIT"

[lib]
name = "graphene"
path = "src/lib.rs"

[[bin]]
name = "graphene"
path = "src/main.rs"

[features]
default = []
tokens = ["dep:tiktoken-rs"]

[dependencies]
logos = "0.14"
petgraph = "0.6"
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
rust_decimal = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiktoken-rs = { version = "0.6", optional = true }
# Blocking HTTP client for real effect hosts (D-048); no async runtime.
ureq = "2"

[dev-dependencies]
insta = "1"
proptest = "1"
